<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Быки и коровы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <h1>Быки и коровы</h1>
    <p class="rules">Загадано 4-значное число с неповторяющимися цифрами. Угадай его за минимум попыток.</p>

    <div class="input-row">
      <input type="text" id="guess-input" placeholder="Например: 1234" maxlength="4">
      <button id="check-btn">Проверить</button>
    </div>

    <p id="error-msg" class="error hidden"></p>

    <p id="win-msg" class="win hidden"></p>

    <div class="stats">
      <span>Попыток: <strong id="attempts-count">0</strong></span>
      <button id="new-game-btn">Новая игра</button>
    </div>

    <ul id="history-list"></ul>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
