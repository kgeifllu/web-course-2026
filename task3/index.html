<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo-list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <h1>Мои задачи</h1>

    <div class="input-row">
      <input type="text" id="task-input" placeholder="Что нужно сделать?">
      <button id="add-btn">Добавить</button>
    </div>

    <p id="empty-warning" class="warning hidden">Введи текст задачи, прежде чем добавлять.</p>

    <div class="counters">
      <span>Осталось: <strong id="count-active">0</strong></span>
      <span>Выполнено: <strong id="count-completed">0</strong></span>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Завершённые</button>
    </div>

    <ul id="task-list"></ul>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
